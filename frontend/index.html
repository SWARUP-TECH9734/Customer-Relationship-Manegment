<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CRM - Customers</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Customer Management</h1>

    <form id="customerForm">

        <input
            type="text"
            id="name"
            placeholder="Customer Name"
            required
        >

        <input
            type="email"
            id="email"
            placeholder="Email"
            required
        >

        <input
            type="text"
            id="phone"
            placeholder="Phone"
            required
        >

        <input
            type="text"
            id="company"
            placeholder="Company"
            required
        >

        <input
            type="text"
            id="address"
            placeholder="Address"
            required
        >

        <select id="status">
            <option value="Lead">Lead</option>
            <option value="Customer">Customer</option>
            <option value="Inactive">Inactive</option>
        </select>

        <button type="submit">
            Add Customer
        </button>

    </form>

    <script src="script.js"></script>

</body>
</html>
